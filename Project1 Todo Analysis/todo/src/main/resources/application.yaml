spring:
  application:
    name: todo.
  datasource:
    url: jdbc:h2:mem:tododb #url that goes in the jdbc url on the console
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate.ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      ##http://localhost:8080/h2-console browser based db console